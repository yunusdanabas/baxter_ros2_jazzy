name: CI

on:
  push:
  pull_request:

jobs:
  hardware-free:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" | sudo tee /etc/apt/sources.list.d/ros2.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-argcomplete \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            ros-jazzy-desktop \
            ros-jazzy-gz-ros2-control \
            ros-jazzy-joint-state-publisher-gui \
            ros-jazzy-moveit \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-ros-gz \
            ros-jazzy-ros2-control \
            ros-jazzy-ros2-controllers \
            ros-jazzy-xacro

      - name: Import pinned core dependency
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p src
          if [ ! -d src/baxter_common_ros2 ]; then
            vcs import src < repos/baxter_core.repos
          fi
          test "$(git -C src/baxter_common_ros2 rev-parse HEAD)" = "678bfabea8c895b4134951a6c076217a90b9e0e6"

      - name: Install workspace dependencies
        run: |
          sudo rosdep init 2>/dev/null || true
          rosdep update --rosdistro jazzy
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src --symlink-install --packages-skip baxter_bridge

      - name: Python compile and import checks
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m compileall -q src/baxter_bringup src/baxter_gz_sim src/baxter_moveit_config src/baxter_examples
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          paths = [
              Path('src/baxter_bringup/launch/baxter_description.launch.py'),
              Path('src/baxter_gz_sim/launch/sim.launch.py'),
              Path('src/baxter_gz_sim/launch/sim_rviz.launch.py'),
              Path('src/baxter_moveit_config/launch/move_group.launch.py'),
              Path('src/baxter_moveit_config/launch/sim_moveit.launch.py'),
              Path('src/baxter_moveit_config/launch/sim_moveit_rviz.launch.py'),
              Path('src/baxter_moveit_config/scripts/wait_for_sim_ready.py'),
              Path('src/baxter_examples/baxter_examples/sim_tiny_trajectory.py'),
              Path('src/baxter_examples/baxter_examples/moveit_left_tiny.py'),
          ]
          for path in paths:
              spec = importlib.util.spec_from_file_location(path.stem.replace('.', '_'), path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
          print('python_import_checks=passed')
          PY

      - name: Model and MoveIt config checks
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 run xacro xacro src/baxter_gz_sim/urdf/baxter_gz_control.urdf.xacro >/tmp/baxter_gz_control.urdf
          check_urdf /tmp/baxter_gz_control.urdf
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          import yaml
          from ament_index_python.packages import get_package_share_directory
          from moveit_configs_utils import MoveItConfigsBuilder

          moveit_share = Path(get_package_share_directory('baxter_moveit_config'))
          gz_share = Path(get_package_share_directory('baxter_gz_sim'))
          urdf_root = ET.parse('/tmp/baxter_gz_control.urdf').getroot()
          srdf_root = ET.parse(moveit_share / 'config' / 'baxter.srdf').getroot()

          links = {link.attrib['name'] for link in urdf_root.findall('link')}
          child_links = {joint.find('child').attrib['link'] for joint in urdf_root.findall('joint')}
          assert links - child_links == {'world'}, links - child_links
          world_joint = urdf_root.find("joint[@name='world_joint']")
          assert world_joint is not None and world_joint.attrib['type'] == 'fixed'
          assert world_joint.find('parent').attrib['link'] == 'world'
          assert world_joint.find('child').attrib['link'] == 'base'
          assert world_joint.find('origin').attrib == {'xyz': '0 0 0.92418', 'rpy': '0 0 0'}

          arm_joints = {
              'left_s0', 'left_s1', 'left_e0', 'left_e1', 'left_w0', 'left_w1', 'left_w2',
              'right_s0', 'right_s1', 'right_e0', 'right_e1', 'right_w0', 'right_w1', 'right_w2',
          }
          state_only_joints = {'head_pan', 'l_gripper_l_finger_joint', 'r_gripper_l_finger_joint'}
          control_joints = {
              joint.attrib['name']: joint for joint in urdf_root.find('ros2_control').findall('joint')
          }
          assert set(control_joints) == arm_joints | state_only_joints, set(control_joints)
          command_joints = {
              name for name, joint in control_joints.items()
              if joint.find("command_interface[@name='position']") is not None
          }
          assert command_joints == arm_joints, command_joints
          for name, joint in control_joints.items():
              position = joint.find("state_interface[@name='position']")
              velocity = joint.find("state_interface[@name='velocity']")
              assert position is not None and velocity is not None, name
              initial = position.find("param[@name='initial_value']")
              assert initial is not None, name

          groups = {group.attrib['name'] for group in srdf_root.findall('group')}
          required_groups = {'left_arm', 'right_arm', 'both_arms', 'left_hand', 'right_hand'}
          assert required_groups <= groups, groups

          states = {(state.attrib['group'], state.attrib['name']) for state in srdf_root.findall('group_state')}
          assert ('left_arm', 'left_neutral') in states, states
          assert ('right_arm', 'right_neutral') in states, states
          assert srdf_root.find('virtual_joint') is None
          for state in srdf_root.findall('group_state'):
              if state.attrib['name'] not in {'left_neutral', 'right_neutral'}:
                  continue
              for joint in state.findall('joint'):
                  position = control_joints[joint.attrib['name']].find(
                      "state_interface[@name='position']/param[@name='initial_value']"
                  )
                  assert float(position.text) == float(joint.attrib['value']), joint.attrib['name']

          collision_pairs = set()
          for collision in srdf_root.findall('disable_collisions'):
              link1, link2 = collision.attrib['link1'], collision.attrib['link2']
              assert link1 in links and link2 in links and link1 != link2, collision.attrib
              pair = tuple(sorted((link1, link2)))
              assert pair not in collision_pairs, pair
              collision_pairs.add(pair)
              assert collision.attrib['reason'] in {'Adjacent', 'Default', 'Never'}
          assert ('left_upper_elbow', 'left_upper_shoulder') not in collision_pairs
          assert ('right_upper_elbow', 'right_upper_shoulder') not in collision_pairs

          with (moveit_share / 'config' / 'ompl_planning.yaml').open() as handle:
              ompl = yaml.safe_load(handle)
          assert ompl['planning_plugins'] == ['ompl_interface/OMPLPlanner'], ompl
          assert 'RRTConnectkConfigDefault' in ompl['planner_configs'], ompl
          for group in ('left_arm', 'right_arm', 'both_arms'):
              assert ompl[group]['default_planner_config'] == 'RRTConnectkConfigDefault', group

          with (gz_share / 'config' / 'ros2_controllers.yaml').open() as handle:
              ros2_controllers = yaml.safe_load(handle)
          assert ros2_controllers['controller_manager']['ros__parameters']['enforce_command_limits'] is True
          for side in ('left', 'right'):
              controller = ros2_controllers[f'{side}_arm_controller']['ros__parameters']
              assert controller['constraints']['goal_time'] > 0
              for joint in controller['joints']:
                  assert controller['constraints'][joint]['trajectory'] > 0
                  assert controller['constraints'][joint]['goal'] == 0.02

          with (moveit_share / 'config' / 'moveit_controllers_sim.yaml').open() as handle:
              controllers = yaml.safe_load(handle)
          simple = controllers['moveit_simple_controller_manager']
          assert simple['controller_names'] == ['left_arm_controller', 'right_arm_controller'], simple
          assert simple['left_arm_controller']['action_ns'] == 'follow_joint_trajectory', simple
          assert simple['right_arm_controller']['action_ns'] == 'follow_joint_trajectory', simple

          config = (
              MoveItConfigsBuilder('baxter', package_name='baxter_moveit_config')
              .robot_description(file_path=str(gz_share / 'urdf' / 'baxter_gz_control.urdf.xacro'))
              .robot_description_semantic(file_path='config/baxter.srdf')
              .trajectory_execution(
                  file_path='config/moveit_controllers_sim.yaml',
                  moveit_manage_controllers=False,
              )
              .planning_pipelines(default_planning_pipeline='ompl', pipelines=['ompl'])
              .to_moveit_configs()
              .to_dict()
          )
          assert 'robot_description' in config and 'robot_description_semantic' in config, config.keys()
          assert config['default_planning_pipeline'] == 'ompl', config.keys()
          assert config['planning_pipelines'] == ['ompl'], config
          assert 'robot_description_kinematics' in config and 'robot_description_planning' in config

          assert 'rviz_default_plugins/RobotModel' in (gz_share / 'config' / 'sim.rviz').read_text()
          moveit_rviz = (moveit_share / 'config' / 'moveit.rviz').read_text()
          assert 'moveit_rviz_plugin/MotionPlanning' in moveit_rviz
          assert 'Fixed Frame: world' in moveit_rviz

          # Qt calls setlocale(LC_ALL, "") before rclcpp::init in rviz2, so under a
          # comma-decimal locale rcl parses every double parameter as a string and
          # loadRobotModel dies. See docs/known_issues.md.
          sim_moveit_launch = (moveit_share / 'launch' / 'sim_moveit.launch.py').read_text()
          assert 'LC_NUMERIC' in sim_moveit_launch, 'rviz2 node must pin LC_NUMERIC=C'
          print(
              f"moveit_static_check=passed groups={sorted(groups)} "
              f"independent_joints={len(control_joints)} acm_pairs={len(collision_pairs)}"
          )
          PY
