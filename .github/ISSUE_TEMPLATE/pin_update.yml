name: Dependency pin update
description: Propose a full-SHA source pin update
title: "[pin] "
labels: [dependencies, pin]
body:
  - type: input
    id: repo
    attributes:
      label: Repository
      placeholder: CentraleNantesRobotics/baxter_common_ros2
    validations:
      required: true
  - type: input
    id: current_sha
    attributes:
      label: Current SHA
      placeholder: 678bfabea8c895b4134951a6c076217a90b9e0e6
    validations:
      required: true
  - type: input
    id: proposed_sha
    attributes:
      label: Proposed SHA
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason for update
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: License status
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Gates run
      description: Include default build and any sim/MoveIt smoke checks affected by the pin.
      render: text
    validations:
      required: true
  - type: textarea
    id: release_notes
    attributes:
      label: Release-note impact
    validations:
      required: true
