    computers:
      contains:
      - HD Temp
      - CPU Usage
      - CPU Temperature
      - HD Usage
      - NFS
      - lm_sensors
      - sysmon
      path: Computers
      timeout: 15.0
      type: diagnostic_aggregator/GenericAnalyzer
    controllers:
      path: Controllers
      startswith:
      - Realtime
      - Controller
      - Robot Config
      - JRCP
      timeout: 10.0
      type: diagnostic_aggregator/GenericAnalyzer
    end_effectors:
      contains:
      - 'EndEffector '
      path: EndEffectors
      timeout: 45.0
      type: diagnostic_aggregator/GenericAnalyzer
    joints:
      contains:
      - 'Joint '
      path: Joints
      timeout: 45.0
      type: diagnostic_aggregator/GenericAnalyzer
    nodes:
      path: Nodes
      regex: Node [0-9]+.*
